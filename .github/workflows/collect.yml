name: Housewatch collector

on:
  schedule:
    # Off-peak minutes: GitHub delays or drops scheduled runs at :00/:15/:30/:45 under load.
    - cron: '7,22,37,52 * * * *'
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housewatch-collector
  cancel-in-progress: false

defaults:
  run:
    working-directory: jarvis

jobs:
  collect:
    if: github.event.schedule != '41 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci
      - run: npm run collect
        env:
          HOUSEWATCH_STORE: supabase
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HOUSEWATCH_REVALIDATE_URL: ${{ secrets.HOUSEWATCH_REVALIDATE_URL }}
          HOUSEWATCH_REVALIDATE_TOKEN: ${{ secrets.HOUSEWATCH_REVALIDATE_TOKEN }}
          HOUSEWATCH_TRAVEL_BUDGET: ${{ vars.HOUSEWATCH_TRAVEL_BUDGET || '10' }}
          # AI extraction (docs/AI-EXTRACTION.md). Off until a key is set; shadow mode until approved.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HOUSEWATCH_AI_PROVIDERS: ${{ vars.HOUSEWATCH_AI_PROVIDERS || 'gemini,groq,openrouter' }}
          HOUSEWATCH_AI_BUDGET: ${{ vars.HOUSEWATCH_AI_BUDGET || '20' }}
          HOUSEWATCH_AI_DAILY_BUDGET: ${{ vars.HOUSEWATCH_AI_DAILY_BUDGET || '300' }}
          HOUSEWATCH_AI_APPLY: ${{ vars.HOUSEWATCH_AI_APPLY || '0' }}
          # New-home alerts (core/notify.mjs): public feed + email (Resend) + web push (VAPID).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HOUSEWATCH_SITE_URL: ${{ vars.HOUSEWATCH_SITE_URL || 'https://housewatch-one.vercel.app' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

  prune:
    if: github.event.schedule == '41 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci
      - run: npm run prune
        env:
          HOUSEWATCH_STORE: supabase
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
